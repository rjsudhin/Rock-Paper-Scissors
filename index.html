<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="./icons/game-controller.png">
</head>
<body>
  <div id="container">
    <h1>Rock Paper Scissors</h1>
    <div class="header">
      <p>YOU:
        <span class="user-score-display"></span>
      </p>
      <p>Computer:
        <span class="computer-score-display"></span>
      </p>
    </div>

    <div class="game-grid">
      <!--Player's result showing here-->
      <div class="game-cards">
        <div class="user-card"></div>
        <div class="computer-card"></div>
        <h2 class="game-winner-display"></h2>
      </div>
    </div>

    <div class="game-controller">
      <button id="rock">Rock</button>
      <button id="scissors">Scissors</button>
      <button id="paper">Paper</button>
    </div>
  </div>
  <script src="js/script.js"></script>
</body>
</html>
